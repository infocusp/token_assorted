# Token Assorted — Stage 1 VQ-VAE (release config): parallel decoder with the repeat up-sampler.
# Compresses the chain-of-thought of MetaMathQA into discrete latent codes, 16 text tokens -> 1 code.
# Baseline for config/vqvae_llama.yaml: identical except upsample_mode (repeat vs the learned
# ConvTranspose1d).
#
#   python -m src.train --config config/vqvae_llama_repeat.yaml
#
# Recipe: Euclidean EMA codebook (|E|=1024, d=512), parallel decoder fed each code repeated r times,
# Llama-3.2 tokenizer, deterministic. Single GPU.

novelty: >-
  Release copy of the repeat up-sampler recipe: val recon_acc ~0.31 (std 0.002 over three seeds).
  Parallel decoder whose input is each code copied r=16 times (repeat_interleave). It is the
  baseline for config/vqvae_llama.yaml, which differs only in upsample_mode (learned
  ConvTranspose1d, val recon_acc ~0.47). Euclidean codebook updated by EMA, dead-code expiry 0.1
  with reset 2.0, Llama-3.2 tokenizer so the codes are usable for Stage 2. deterministic: true
  makes the run exactly repeatable.

# ---- tokenizer / data ----
tokenizer_name: unsloth/Llama-3.2-1B      # ungated mirror of meta-llama/Llama-3.2-1B (paper
                                          # default; no HF login) — matches the Stage-2 LLM vocab,
                                          # so this run's codes are usable for Stage 2.
dataset_name: meta-math/MetaMathQA
dataset_split: train
data_fixture: null                        # path to an offline JSONL fixture (smoke/tests); null = use HF
n_val: 2000                               # held-out tail rows (MetaMathQA has no val split)
compress_target: cot                      # {cot, full}: what encode_dataset.py compresses
num_workers: 16

# ---- chunking (§4) ----
max_seq: 256                              # T: pad/truncate X = P (+) C (+) S to this length
compression_rate: 16                      # r: text tokens per code (Conv1d kernel = stride = r)
chunk_length: 16                          # L: paper chunk length; must equal r (1 code per chunk)

# ---- model (Appendix A.1) ----
d_model: 512                              # d; codebook vectors live in R^d
n_layers: 2                               # both f_enc and f_dec
n_heads: 4
ffn_mult: 4                               # informational: the vendored block fixes FFN = 4*d (SwiGLU)
dropout: 0.0                              # paper: no dropout
norm_eps: 1.0e-5
rope_freq: 10000.0

# ---- decoder wiring (design choices) ----
decoder_mode: parallel                    # paper's f_dec: decodes codes + g(P) only, no teacher
                                          #   forcing — the honest measure of what the codes carry
upsample_mode: repeat                     # repeat_interleave: each code is copied r times. The learned
                                          #   ConvTranspose1d alternative is upsample_mode: conv_transpose
                                          #   (see config/vqvae_llama.yaml).
tie_head: true                            # tie output projection to the token embedding
dec_input_dropout: 0.0                    # AR only: drop decoder-input tokens to force latent use

# ---- vector quantizer (§3.1 Eq.2; vector-quantize-pytorch, MIT) ----
codebook_size: 1024                       # |E|
codebook_dim: null                        # null -> d_model (paper R^d). NOTE: < d_model is buggy with
                                          #   forward(mask=...) in vector-quantize-pytorch 1.29.1.
commitment_beta: 0.25                     # beta in Eq.2 (paper unspecified; VQ-VAE standard)
vq_decay: 0.99                            # EMA decay for codebook + cluster-size tracking
vq_ema: true                              # EMA codebook: the ||sg[X̄]-q(X̄)||^2 term of Eq. 2 is
                                          #   realized by EMA updates; vq_loss = beta*commitment only.
                                          #   The only workable reading at lr=1e-5 — a gradient-trained
                                          #   codebook moves ~lr/step and cannot track the encoder.
kmeans_init: true                         # cold-start guard
kmeans_iters: 10
threshold_ema_dead_code: 0.1              # EMA cluster_size steady state = a code's mean per-batch
                                          #   usage: ~450 valid codes/batch over |E|=1024 -> ~0.44
                                          #   uniform. A threshold of 2 sits above that ceiling and
                                          #   churns the whole codebook every step; 0.1 recycles only
                                          #   genuinely dead codes.
vq_reset_cluster_size: 2.0                # grace period for restarted codes: the library defaults
                                          #   reset to the threshold itself, so an unused restarted
                                          #   code re-expires after ONE batch. 2.0 at decay 0.99
                                          #   gives ~300 unused steps before re-expiry.
rotation_trick: false                     # false -> paper's plain straight-through estimator
use_cosine_sim: false                     # false -> Euclidean codebook. true -> cosine-similarity
                                          #   codebook (L2-normalized X̄ + codes); changes the
                                          #   quantizer geometry.

# ---- optimization (§4.2) ----
lr: 1.0e-5                                # Adam
betas: [0.9, 0.999]
weight_decay: 0.0                         # paper uses Adam (not AdamW)
batch_size: 32
steps: 100000
grad_clip: 1.0
warmup: 0                                 # 0 -> flat LR (paper); >0 uses vendored lr_constant/lr_cosine
lr_schedule: constant                     # {constant, cosine}
amp: true                                 # mixed precision (bf16); CUDA only, auto-off on CPU/MPS

# ---- run / logging ----
seed: 0
deterministic: true                       # bit-reproducible: pins the cuBLAS workspace and forces
                                          #   deterministic kernels (~2-11% slower)
device: auto                              # {auto, cuda, mps, cpu}
out_dir: runs
run_name: vqvae-llama-repeat              # runs/<run_name>/{best.pt,last.pt,metrics.*}
mlflow: true                             # MLflow logging on; --no-mlflow turns it off
mlflow_experiment: "stage1(VQ-VAE)"       # MLflow experiment name (groups all Stage-1 runs)
mlflow_run_name: vqvae-llama-repeat
log_every: 20
eval_every: 500
ckpt_every: 1000
