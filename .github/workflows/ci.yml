name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.1
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-only torch: the tests need no GPU, and the CUDA 12.8 wheel in requirements.txt is
      # several GB. The torch==2.8.0 pin in requirements.txt is satisfied by 2.8.0+cpu.
      - name: Install dependencies
        run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install "peft==0.19.1" "accelerate==1.14.0" "fire==0.7.1"
          pip install --no-deps "llama-cookbook==0.0.5.post1"
      - run: pytest -rs
